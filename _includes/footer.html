{% assign image = page.footer | default: site.footer %}
{% assign dark = page.footer-dark | is_nil: site.footer-dark | is_nil: true %}

<footer
  class="background"
  style="--image: url('{{ image | relative_url | uri_escape }}')"
  {% if dark == true or dark == false %}
    data-dark="{{ dark }}"
  {% endif %}
  data-size="wide"
>
  <section class="funding-section">
    <h2>Funding sources</h2>
    <div class="funding-grid">
      <div class="funding-card"><img src="{{ '/images/funding-icm.png' | relative_url }}" alt="Millennium Science Initiative"></div>
      <div class="funding-card"><img src="{{ '/images/funding-government.jpg' | relative_url }}" alt="FONDAP / ANID"></div>
      <div class="funding-card"><img src="{{ '/images/funding-puc.png' | relative_url }}" alt="Pontificia Universidad Católica de Chile"></div>
      <div class="funding-card"><img src="{{ '/images/funding-cgr.jpg' | relative_url }}" alt="Center for Genome Regulation"></div>
      <div class="funding-card"><img src="{{ '/images/funding-ibio.jpg' | relative_url }}" alt="iBio Institute"></div>
    </div>
  </section>

  <div>
    &copy; {{ site.time | date: "%Y" }}
    {{ site.title }}
  </div>

  <input
    type="checkbox"
    class="dark-toggle"
    data-tooltip="Dark mode"
    aria-label="toggle dark mode"
    oninput="onDarkToggleChange(event)"
  >
</footer>
